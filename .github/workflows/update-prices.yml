name: 毎日価格更新

on:
  schedule:
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 価格取得スクリプト実行
        run: python fetch_prices.py

      - name: prices.json をコミット・プッシュ
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add prices.json
          git diff --staged --quiet || git commit -m "価格更新: $(date '+%Y-%m-%d %H:%M') JST"
          git push
